name: Generate GitHub stats images

on:
  schedule: # runs once a day
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate images
        uses: jstrieb/github-stats@master
        with:
          username: fernandoaneto2
          access_token: ${{ secrets.ACCESS_TOKEN }}
          exclude_repos:
          exclude_langs: HTML
          hide_border: true
